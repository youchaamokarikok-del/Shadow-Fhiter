name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer "cython<3"
      - name: Accept licenses
        run: sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log
      - name: SHOW ERROR
        if: always()
        run: sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' build.log | grep -v '^#' | tail -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowFighter-apk
          path: bin/*.apk
